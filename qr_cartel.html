<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QR Fiscalización</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1240px; background:#fff; font-family:"Segoe UI", Arial, sans-serif; color:#16243d; }
  .head { background:#0b2a5b; color:#fff; padding:64px 72px 56px; position:relative; text-align:center; }
  .head::after { content:""; position:absolute; left:0; right:0; bottom:0; height:12px;
    background:linear-gradient(90deg,#74acdf 0 33.3%,#fff 33.3% 66.6%,#74acdf 66.6%); }
  .org { font-size:32px; letter-spacing:8px; font-weight:700; opacity:.85; }
  h1 { font-size:62px; line-height:1.12; margin-top:18px; font-weight:800; }
  .qr { display:block; width:820px; margin:64px auto 28px; }
  .scan { text-align:center; font-size:38px; font-weight:700; color:#0b2a5b; }
  .items { margin:40px 110px 0; display:grid; gap:20px; }
  .item { display:flex; align-items:center; gap:24px; background:#e9f0fb; border-left:10px solid #1f5fbf;
    padding:24px 30px; font-size:30px; line-height:1.3; }
  .num { font-size:34px; font-weight:800; color:#1f5fbf; }
  .foot { text-align:center; color:#5b6b85; font-size:24px; margin:44px 0 60px; }
</style>
</head>
<body>
  <div class="head">
    <div class="org">RENAPER · DPFCD</div>
    <h1>Fiscalización de<br>Centros de Documentación</h1>
  </div>
  <img class="qr" src="qr_fiscalizacion.svg" alt="QR">
  <div class="scan">Escaneá el código para verificar</div>
  <div class="items">
    <div class="item"><span class="num">1</span><span>Nómina del personal autorizado para fiscalizar</span></div>
    <div class="item"><span class="num">2</span><span>Disposición que da inicio a las fiscalizaciones</span></div>
  </div>
  <div class="foot">Dirección DPFCD · RENAPER</div>
</body>
</html>
